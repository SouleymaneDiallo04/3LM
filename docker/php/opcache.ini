; Opcache : amortit la compilation PHP à travers le bind mount (dev Windows/
; macOS, où chaque stat de fichier coûte cher). En production, passer
; validate_timestamps=0 (code immuable dans l'image).
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=1
opcache.revalidate_freq=2
