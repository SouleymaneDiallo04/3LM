services:
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: fbde_app
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [fbde]

  # Workers de files d'attente (§5.2 : Redis + Horizon — imports, crawling,
  # exports en tâches de fond avec supervision et reprises).
  horizon:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: fbde_horizon
    working_dir: /var/www/html
    command: php artisan horizon
    volumes:
      - ./backend:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [fbde]

  # Tâches planifiées (§2.1, EF-07.4) : purge des exports expirés chaque
  # nuit, re-import mensuel du stock SIRENE.
  scheduler:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: fbde_scheduler
    working_dir: /var/www/html
    command: php artisan schedule:work
    volumes:
      - ./backend:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [fbde]

  nginx:
    image: nginx:1.27-alpine
    container_name: fbde_nginx
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks: [fbde]

  postgres:
    image: postgis/postgis:16-3.4
    container_name: fbde_postgres
    environment:
      POSTGRES_DB: fbde
      POSTGRES_USER: fbde
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - fbde_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fbde"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [fbde]

  redis:
    image: redis:7-alpine
    container_name: fbde_redis
    ports:
      - "6379:6379"
    networks: [fbde]

volumes:
  fbde_pgdata:

networks:
  fbde:
    driver: bridge
